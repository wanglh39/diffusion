site_name: Differtion
site_description: 从零开始用 PyTorch 手写扩散模型
site_url: https://wanglh39.github.io/diffusion/
repo_url: https://github.com/wanglh39/diffusion
repo_name: wanglh39/diffusion

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: light mode
  font:
    text: Noto Sans SC
    code: JetBrains Mono

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - index: index.md
  - Stage1: stage1.md
  - Stage2: stage2.md
  - Stage3: stage3.md
  - Stage4: stage4.md
  - Stage5: stage5.md
